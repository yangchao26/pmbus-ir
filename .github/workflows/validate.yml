name: Validate PMBus IR

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Run semantic validation tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate QODN217A0B reference document
        run: python tools/validate.py validate examples/reference/qodn217a0b.pmbus.yaml
