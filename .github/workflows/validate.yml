name: Validate PMBus IR

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -e .

      - name: Run semantic validation tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate QODN217A0B reference document
        run: python tools/validate.py validate examples/reference/qodn217a0b.pmbus.yaml

      - name: Validate EBDW025A0B reference document
        run: python tools/validate.py validate examples/reference/ebdw025a0b.pmbus.yaml

      - name: Validate both references through installed CLI
        run: |
          pmbus-ir validate examples/reference/qodn217a0b.pmbus.yaml
          pmbus-ir validate examples/reference/ebdw025a0b.pmbus.yaml

