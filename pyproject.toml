[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmbus-ir"
version = "0.1.0"
description = "Vendor-neutral PMBus intermediate representation and validator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.18,<5"]

[project.scripts]
pmbus-ir = "tools.validate:main"

[tool.setuptools]
packages = ["tools", "schema"]

[tool.setuptools.package-data]
schema = ["*.json"]
